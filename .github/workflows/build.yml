name: Build JS
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      # The renderer is included in the pinned rive-runtime submodule.
      # Build the advanced WebGL2 package that this fork actually ships.
      - name: Build SIMD and scalar WebGL2 packages
        working-directory: wasm
        run: ./build_all_wasm.sh -r webgl2
      - name: Test the packed package in Chrome
        env:
          CHROME_BIN: google-chrome
        run: npm --prefix js run test:webgl2-package
